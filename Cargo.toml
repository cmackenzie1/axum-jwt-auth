[package]
name = "axum-jwt-auth"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
authors = ["Cole MacKenzie"]
description = "A simple JWT authentication middleware for Axum"
license = "MIT"
repository = "https://github.com/cmackenzie1/axum-jwt-auth"

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls"]
rustls-tls-native-roots = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]
native-tls-vendored = ["reqwest/native-tls-vendored"]

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["typed-header", "cookie"] }
dashmap = "6.2.1"
jsonwebtoken = { version = "12", features = ["rust_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["time"] }
tokio-util = "0.7.20"
tracing = { version = "0.1.44", features = ["log"] }

[dev-dependencies]
chrono = "0.4.45"
tokio = { version = "1.54.1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
] }
serde_json = "1.0.154"
tracing-subscriber = "0.3.23"
rand = "0.10.4"

[[example]]
name = "local"
path = "examples/local/local.rs"

[[example]]
name = "remote"
path = "examples/remote/remote.rs"

[[example]]
name = "cloudflare"
path = "examples/cloudflare/cloudflare.rs"
